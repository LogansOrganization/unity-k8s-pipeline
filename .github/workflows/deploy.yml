name: Unity Server Build & Deploy (reusable)

on:
  workflow_call:
    inputs:
      server_image_name:
        description: "Override for the runtime server image ref. Auto-derived from the Unity project's Product Name (PlayerSettings) if left blank, falling back to the repo name."
        required: false
        type: string
        default: ""
      k8s_namespace:
        description: "Override for the target Kubernetes namespace. Auto-derived the same way as server_image_name if left blank. Created automatically on first use if it doesn't exist."
        required: false
        type: string
        default: ""
      unity_ci_image:
        description: "Shared Unity build toolchain image. Only override if this game needs a different Unity version than the default toolchain build."
        required: false
        type: string
        default: ghcr.io/logansorganization/unity-ci-build:v1
      build_method:
        description: "Static C# method Unity's -executeMethod should call to produce the server build"
        required: false
        type: string
        default: Build.Server
      fleet_manifest:
        description: "Path (in the calling repo) to the Agones Fleet manifest, containing a __IMAGE_TAG__ placeholder"
        required: false
        type: string
        default: k8s/fleet.yaml
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: [self-hosted, homelab-k8s]
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    outputs:
      namespace: ${{ steps.resolve.outputs.namespace }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Namespace and Image Name
        id: resolve
        env:
          INPUT_NAMESPACE: ${{ inputs.k8s_namespace }}
          INPUT_IMAGE_NAME: ${{ inputs.server_image_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PRODUCT_NAME=$(grep -m1 '^\s*productName:' ProjectSettings/ProjectSettings.asset | sed 's/.*productName:[[:space:]]*//' || true)
          SOURCE="${PRODUCT_NAME:-$REPO_NAME}"
          SLUG=$(echo "$SOURCE" | tr '[:upper:]' '[:lower:]' | tr ' _' '-' | tr -cd 'a-z0-9-' | sed 's/^-*//; s/-*$//')
          SLUG=${SLUG:0:63}
          SLUG=$(echo "$SLUG" | sed 's/-*$//')

          NAMESPACE="${INPUT_NAMESPACE:-$SLUG}"
          IMAGE_NAME="${INPUT_IMAGE_NAME:-ghcr.io/logansorganization/unity-server-$SLUG}"

          echo "Resolved slug source: $([ -n "$PRODUCT_NAME" ] && echo 'Product Name' || echo 'repo name') ($SOURCE)"
          echo "Resolved namespace: $NAMESPACE"
          echo "Resolved image name: $IMAGE_NAME"
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract Unity Serial from License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" > /tmp/unity_license.ulf
          B64=$(grep -oP '(?<=<DeveloperData Value=")[^"]*' /tmp/unity_license.ulf)
          SERIAL=$(echo "$B64" | base64 -d | tail -c +5)
          echo "::add-mask::$SERIAL"
          echo "UNITY_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          rm -f /tmp/unity_license.ulf

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Cluster Access
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          # The in-cluster runner comes with a kubeconfig for its ServiceAccount (homelab-k8s).
          if ! kubectl auth can-i create jobs.batch -n "$NAMESPACE" --request-timeout=15s | grep -qx yes; then
            echo "::error::This runner can't create Jobs in '$NAMESPACE'. Is it the in-cluster runner (label homelab-k8s), and is k8s/rbac-build.yaml applied?"
            exit 1
          fi

      - name: Ensure Namespace Exists
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply --request-timeout=15s -f -

      - name: Ensure GHCR Pull Secret
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          # imagePullSecrets are namespace-scoped, so a freshly created namespace
          # needs its own copy — propagated from the one-time secret in `default`
          # rather than requiring it be recreated manually per game.
          if [ "$NAMESPACE" != "default" ]; then
            kubectl get secret ghcr-pull-secret -n default -o jsonpath='{.data.\.dockerconfigjson}' \
              | base64 -d > /tmp/dockerconfig.json
            kubectl create secret generic ghcr-pull-secret \
              --type=kubernetes.io/dockerconfigjson \
              --from-file=.dockerconfigjson=/tmp/dockerconfig.json \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply --request-timeout=15s -f -
            rm -f /tmp/dockerconfig.json
          fi

      - name: Create Per-Run Secrets
        env:
          GH_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          kubectl create secret generic unity-build-token-${{ github.sha }} \
            --from-literal=token="$GH_TOKEN_VALUE" \
            --namespace="$NAMESPACE" \
            --request-timeout=15s \
            --dry-run=client -o yaml | kubectl apply --request-timeout=15s -f -

          kubectl create secret generic unity-license-${{ github.sha }} \
            --from-literal=email="$UNITY_EMAIL" \
            --from-literal=password="$UNITY_PASSWORD" \
            --from-literal=serial="$UNITY_SERIAL" \
            --namespace="$NAMESPACE" \
            --request-timeout=15s \
            --dry-run=client -o yaml | kubectl apply --request-timeout=15s -f -

      - name: Render and Apply Unity Build Job
        env:
          RUN_ID: ${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          GIT_REPO_URL: https://github.com/${{ github.repository }}.git
          UNITY_CI_IMAGE: ${{ inputs.unity_ci_image }}
          BUILD_METHOD: ${{ inputs.build_method }}
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          cat <<JOBEOF | kubectl apply --request-timeout=15s -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: unity-build-${RUN_ID}
            namespace: ${NAMESPACE}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: ghcr-pull-secret
                containers:
                  - name: build
                    image: ${UNITY_CI_IMAGE}
                    env:
                      - name: UNITY_EMAIL
                        valueFrom:
                          secretKeyRef:
                            name: unity-license-${RUN_ID}
                            key: email
                      - name: UNITY_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: unity-license-${RUN_ID}
                            key: password
                      - name: UNITY_SERIAL
                        valueFrom:
                          secretKeyRef:
                            name: unity-license-${RUN_ID}
                            key: serial
                      - name: GITHUB_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: unity-build-token-${RUN_ID}
                            key: token
                      - name: GIT_REF
                        value: "${GIT_SHA}"
                      - name: GIT_REPO_URL
                        value: "${GIT_REPO_URL}"
                      - name: BUILD_METHOD
                        value: "${BUILD_METHOD}"
                    resources:
                      requests:
                        cpu: "250m"
                        memory: "4Gi"
                      limits:
                        cpu: "4"
                        memory: "8Gi"
          JOBEOF

      - name: Wait For Unity Build Job
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          for i in $(seq 1 120); do
            POD=$(kubectl get pods -n "$NAMESPACE" -l job-name=unity-build-${{ github.sha }} --request-timeout=15s -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              EXIT_CODE=$(kubectl exec "$POD" -n "$NAMESPACE" --request-timeout=15s -- cat /workspace/BUILD_EXIT_CODE 2>/dev/null || true)
              if [ -n "$EXIT_CODE" ]; then
                echo "POD_NAME=$POD" >> "$GITHUB_ENV"
                echo "BUILD_JOB_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"
                echo "Build phase finished with exit code $EXIT_CODE"
                exit 0
              fi
              PHASE=$(kubectl get pod "$POD" -n "$NAMESPACE" --request-timeout=15s -o jsonpath='{.status.phase}' 2>/dev/null || true)
              if [ "$PHASE" = "Failed" ]; then
                echo "Pod failed before completing the build — logs:"
                kubectl logs "$POD" -n "$NAMESPACE" --request-timeout=15s || true
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for Unity build job"
          [ -n "${POD:-}" ] && kubectl logs "$POD" -n "$NAMESPACE" --request-timeout=15s || true
          exit 1

      - name: Extract Build Output
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          kubectl cp "$POD_NAME:/workspace/buildServer" ./buildServer -n "$NAMESPACE" --request-timeout=15s
          echo "Unity build exit code was $BUILD_JOB_EXIT_CODE"
          [ "$BUILD_JOB_EXIT_CODE" = "0" ]

      - name: Clean Up Unity Build Job
        if: always()
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
        run: |
          kubectl delete job unity-build-${{ github.sha }} -n "$NAMESPACE" --request-timeout=15s --ignore-not-found
          kubectl delete secret unity-build-token-${{ github.sha }} -n "$NAMESPACE" --request-timeout=15s --ignore-not-found
          kubectl delete secret unity-license-${{ github.sha }} -n "$NAMESPACE" --request-timeout=15s --ignore-not-found

      - name: Build Server Runtime Image
        env:
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" .

      - name: Push Server Runtime Image
        env:
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    needs: build
    runs-on: [self-hosted, homelab-k8s]

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Fleet Image Tag
        run: |
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|" ${{ inputs.fleet_manifest }}

      - name: Apply Fleet
        env:
          NAMESPACE: ${{ needs.build.outputs.namespace }}
        run: |
          kubectl apply -n "$NAMESPACE" -f ${{ inputs.fleet_manifest }}
          FLEET_NAME=$(kubectl get -n "$NAMESPACE" -f ${{ inputs.fleet_manifest }} -o jsonpath='{.metadata.name}')
          echo "FLEET_NAME=$FLEET_NAME" >> "$GITHUB_ENV"

      - name: Wait For Fleet Rollout
        env:
          NAMESPACE: ${{ needs.build.outputs.namespace }}
        run: |
          for i in $(seq 1 30); do
            READY=$(kubectl get fleet "$FLEET_NAME" -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}')
            ALLOCATED=$(kubectl get fleet "$FLEET_NAME" -n "$NAMESPACE" -o jsonpath='{.status.allocatedReplicas}')
            DESIRED=$(kubectl get fleet "$FLEET_NAME" -n "$NAMESPACE" -o jsonpath='{.spec.replicas}')
            READY=${READY:-0}
            ALLOCATED=${ALLOCATED:-0}
            echo "Ready: $READY, Allocated: $ALLOCATED, Desired: $DESIRED"
            [ "$((READY + ALLOCATED))" -ge "$DESIRED" ] && exit 0
            sleep 10
          done
          echo "Timed out waiting for fleet rollout" >&2
          exit 1

      - name: Where Players Connect
        if: always()
        env:
          NAMESPACE: ${{ needs.build.outputs.namespace }}
        run: |
          # Game servers register with unity-relay; its server list is what the game's browser shows.
          RELAY=http://relay.unity-relay.svc.cluster.local:8080
          sleep 20   # give fresh servers a moment to register
          SERVERS=$(curl -fsS --max-time 10 "$RELAY/servers" || echo '[]')
          HOST=$(echo "$SERVERS" | jq -r '.[0].connect_address // empty' | sed 's/:[0-9]*$//')
          {
            echo "## \`${FLEET_NAME:-fleet}\` deployed (${{ github.sha }})"
            echo ""
            echo "Fleet: $(kubectl get fleet "${FLEET_NAME}" -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo '?') ready."
            echo ""
            echo "| Server | Players | Connect |"
            echo "|---|---|---|"
            echo "$SERVERS" | jq -r '.[] | "| \(.name) | \(.player_count)/\(.max_players) | `\(.connect_address)` |"'
            echo ""
            echo "Server browser: the game's \`-relay\` URL is \`http://${HOST:-<relay public host>}:8080\`."
          } >> "$GITHUB_STEP_SUMMARY"
