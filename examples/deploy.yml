# Copy this to .github/workflows/deploy.yml in a new game repo and adjust
# server_image_name, k8s_namespace (and build_method if your build script isn't
# Build.Server). k8s_namespace gets created automatically on first push if it
# doesn't already exist — no manual cluster setup needed per game.
name: Build and Deploy Unity Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: LogansOrganization/unity-k8s-pipeline/.github/workflows/deploy.yml@v1
    with:
      server_image_name: ghcr.io/logansorganization/unity-server-CHANGEME
      k8s_namespace: CHANGEME
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
