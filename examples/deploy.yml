# Copy this to .github/workflows/deploy.yml in a new game repo. That's it —
# server_image_name and k8s_namespace auto-derive from the Unity project's
# Product Name (PlayerSettings), falling back to the repo name, and the
# namespace is created automatically on first push if it doesn't exist yet.
# Only add `with:` overrides below if you want something different (see
# deploy.yml's workflow_call inputs in this repo for all available overrides,
# e.g. build_method if your build script isn't Build.Server).
name: Build and Deploy Unity Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: LogansOrganization/unity-k8s-pipeline/.github/workflows/deploy.yml@v1
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
