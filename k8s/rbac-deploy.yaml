# One-time cluster setup (apply once, like k8s/rbac-build.yaml) — grants the CI
# runner's ServiceAccount cluster-wide permission to manage Agones Fleets, for
# any game repo using this pipeline in any namespace:
#
#   kubectl apply -f k8s/rbac-deploy.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unity-fleet-manager
rules:
  - apiGroups: ["agones.dev"]
    resources: ["fleets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unity-fleet-manager-binding
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-runner
roleRef:
  kind: ClusterRole
  name: unity-fleet-manager
  apiGroup: rbac.authorization.k8s.io
