# One-time cluster setup (apply once, like k8s/rbac-build.yaml) — grants the CI
# runner's ServiceAccount permission to manage Agones Fleets in the target
# namespace, for any game repo using this pipeline:
#
#   kubectl apply -f k8s/rbac-deploy.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unity-fleet-manager
  namespace: default
rules:
  - apiGroups: ["agones.dev"]
    resources: ["fleets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unity-fleet-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-runner
roleRef:
  kind: Role
  name: unity-fleet-manager
  apiGroup: rbac.authorization.k8s.io
