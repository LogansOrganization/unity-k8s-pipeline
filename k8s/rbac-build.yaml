# One-time cluster setup (apply once, ever — regardless of how many game repos
# or namespaces use this pipeline) — grants the CI runner's ServiceAccount
# cluster-wide permission to create a game's namespace on first use, and to
# manage the ephemeral Unity build Job within it:
#
#   kubectl apply -f k8s/rbac-build.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unity-build-job-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unity-build-job-manager-binding
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-runner
roleRef:
  kind: ClusterRole
  name: unity-build-job-manager
  apiGroup: rbac.authorization.k8s.io
