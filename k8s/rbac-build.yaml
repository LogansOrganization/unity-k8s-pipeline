# One-time cluster setup (apply once, regardless of how many game repos use this
# pipeline) — grants the CI runner's ServiceAccount permission to manage the
# ephemeral Unity build Job in the target namespace:
#
#   kubectl apply -f k8s/rbac-build.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unity-build-job-manager
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unity-build-job-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-runner
roleRef:
  kind: Role
  name: unity-build-job-manager
  apiGroup: rbac.authorization.k8s.io
